<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eFHUB 27 - Players & Managers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Barlow Condensed', 'sans-serif'] },
                    colors: { ef: { bg: '#121318', surface: '#1b1d24', panel: '#252832', lime: '#d4fc24', limeHover: '#e2ff52' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css_source.css">
</head>
<body class="bg-ef-bg text-white antialiased selection:bg-ef-lime selection:text-black">

    <!-- TOP NAVBAR -->
    <header class="sticky top-0 z-40 bg-[#15171e]/95 backdrop-blur border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
            <div class="flex items-center gap-6">
                <a href="#" onclick="resetAll()" class="flex items-center gap-1.5 font-display italic font-extrabold text-2xl">
                    <span class="text-ef-lime">27</span><span>eFHUB</span>
                </a>
                <nav class="flex items-center gap-5 text-sm font-medium">
                    <button onclick="scrollToSection('playersSection')" class="text-white hover:text-ef-lime transition">Players</button>
                    <button onclick="scrollToSection('managersSection')" class="text-slate-400 hover:text-ef-lime transition">Managers</button>
                </nav>
            </div>
            <div class="flex items-center gap-2.5">
                <div class="relative hidden sm:block w-56">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input id="topSearch" type="text" oninput="handleSearch(this.value)" placeholder="Search players & managers" class="w-full bg-ef-panel border border-white/5 focus:border-ef-lime rounded-lg pl-8 pr-3 py-1.5 text-xs outline-none">
                </div>
                <button onclick="resetAll()" class="bg-ef-lime hover:bg-ef-limeHover text-black font-bold text-xs px-3.5 py-1.5 rounded-full transition">Reset</button>
            </div>
        </div>
    </header>

    <!-- HERO BANNER -->
    <section class="relative overflow-hidden bg-[#0e1015] border-b border-white/5 py-7 px-4">
        <div class="pointer-events-none absolute -left-12 -top-6 w-56 h-32 bg-ef-lime/80 -skew-x-12 rotate-6 rounded-2xl"></div>
        <div class="pointer-events-none absolute -right-12 -bottom-8 w-80 h-32 bg-ef-lime -skew-x-12 -rotate-3 rounded-2xl"></div>
        <div class="relative z-10 max-w-2xl mx-auto flex items-center gap-4">
            <span class="font-display italic font-extrabold text-3xl shrink-0">eFHUB</span>
            <div class="relative w-full">
                <input id="heroSearch" type="text" oninput="handleSearch(this.value)" placeholder="Search players & managers..." class="w-full bg-[#1e212b]/95 border border-white/10 focus:border-ef-lime rounded-xl px-4 py-2.5 text-sm outline-none shadow-lg">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            </div>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-10">

        <!-- SECTION: LATEST PLAYERS -->
        <section id="playersSection" class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <h2 class="border-l-[3px] border-ef-lime pl-2.5 font-bold text-base">Latest Players</h2>
                <div class="flex flex-wrap items-center gap-1.5" id="filterBars"></div>
            </div>

            <!-- Grid Players -->
            <div id="playersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5"></div>

            <!-- Nút vàng giữa trang giống ảnh mẫu -->
            <div class="flex justify-center pt-2">
                <button id="toggleAllBtn" onclick="toggleShowAllPlayers()" class="bg-ef-lime hover:bg-ef-limeHover text-black font-bold text-xs px-6 py-2.5 rounded-full shadow-md transition">
                    See all new players <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </section>

        <!-- SECTION: LATEST MANAGERS -->
        <section id="managersSection" class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="border-l-[3px] border-ef-lime pl-2.5 font-bold text-base">Latest Managers</h2>
                <span class="text-xs text-slate-400">Tap manager to inspect playstyle</span>
            </div>
            <div id="managersGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </section>
    </main>

    <!-- MODAL CHI TIẾT (Dùng chung cho cả Player, Manager, Booster & Position) -->
    <div id="mainModal" onclick="if(event.target===this) closeModal()" class="fixed inset-0 z-50 hidden items-center justify-center p-3 bg-black/80 backdrop-blur-sm">
        <div class="w-full max-w-4xl max-h-[90vh] bg-ef-surface border border-white/10 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-5 py-3 bg-ef-panel border-b border-white/10">
                <div class="flex items-center gap-2.5">
                    <span id="modalBadge" class="text-[11px] font-extrabold uppercase px-2 py-0.5 rounded bg-ef-lime text-black">BIG TIME</span>
                    <h3 id="modalTitle" class="font-display font-extrabold italic text-xl uppercase">Title</h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-rose-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalBody" class="overflow-y-auto p-5 space-y-5"></div>
        </div>
    </div>

    <!-- SUB-MODAL (Chọn Booster / Position Booster) -->
    <div id="subModal" onclick="if(event.target===this) closeSubModal()" class="fixed inset-0 z-[60] hidden items-center justify-center p-3 bg-black/85">
        <div class="w-full max-w-md max-h-[85vh] bg-ef-surface border border-white/10 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
                <h4 id="subModalTitle" class="font-bold text-sm">Select Booster</h4>
                <button onclick="closeSubModal()" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="subModalBody" class="overflow-y-auto p-4 space-y-2.5"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 transition-all bg-ef-panel border border-ef-lime text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-ef-lime"></i><span id="toastMsg"></span>
    </div>

    <script src="js_source.js" defer></script>
</body>
</html>
