<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Details - eFHUB 27</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Cấu hình màu sắc đồng bộ với trang chủ -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Barlow Condensed', 'sans-serif'] },
                    colors: { ef: { bg: '#121318', surface: '#1b1d24', panel: '#252832', lime: '#d4fc24', limeHover: '#e2ff52' } }
                }
            }
        }
    </script>

    <!-- Đảm bảo tên file CSS khớp với file trên máy của bạn (css_source.css hoặc main_style.css) -->
    <link rel="stylesheet" href="css_source.css">
</head>
<body class="bg-ef-bg text-white antialiased p-4 sm:p-8 selection:bg-ef-lime selection:text-black">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Nút quay lại trang chủ -->
        <div class="flex items-center justify-between">
            <a href="#" onclick="resetAll()" class="flex items-center gap-1.5 font-display italic font-extrabold text-2xl">
                    <span class="text-ef-lime">27</span><span>eFHUB</span>
            </a>
        </div>

        <!-- Khu vực hiển thị chi tiết cầu thủ -->
        <div id="playerDetailContainer" class="space-y-5"></div>
    </div>

    <!-- Sub-modal chọn Booster / Position Booster -->
    <div id="subModal" onclick="if(event.target===this) closeSubModal()" class="fixed inset-0 z-[60] hidden items-center justify-center p-3 bg-black/85 backdrop-blur-sm">
        <div class="w-full max-w-md max-h-[85vh] bg-ef-surface border border-white/10 rounded-2xl flex flex-col overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
                <h4 id="subModalTitle" class="font-bold text-sm">Select Booster</h4>
                <button onclick="closeSubModal()" class="w-7 h-7 rounded-lg hover:bg-white/10 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="subModalBody" class="overflow-y-auto p-4 space-y-2.5"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 transition-all bg-ef-panel border border-ef-lime text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-ef-lime"></i><span id="toastMsg"></span>
    </div>

    <!-- Đảm bảo tên file JS khớp với file trên máy của bạn (js_source.js hoặc main_data.js) -->
    <script type="module" src="js_source.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const rawId = params.get('id');
        const id = Number(rawId);
        const container = document.getElementById('playerDetailContainer');

        if (!container) {
            console.error('Thiếu #playerDetailContainer trong player.html');
            return;
        }

        if (!Number.isInteger(id) || id <= 0) {
            container.innerHTML = '<div class="text-center text-rose-400 py-10 font-bold">Player not found or invalid ID!</div>';
            return;
        }

        const startLoad = () => {
            if (typeof window.loadPlayerProfile === 'function') {
                window.loadPlayerProfile(id);
            } else {
                setTimeout(startLoad, 50);
            }
        };
        startLoad();
    });
</script>
</body>
</html>
